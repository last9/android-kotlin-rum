VERSION_NAME=0.2.3

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35
android.dependencyResolutionAtConfigurationTime.disallow=false

# Required for desugaring with minSdk < 26 (Android Gradle Plugin 8.3.0+)
android.useFullClasspathForDexingTransform=true

# Maven Central publishing credentials (set via environment variables in CI):
#   ORG_GRADLE_PROJECT_mavenCentralUsername
#   ORG_GRADLE_PROJECT_mavenCentralPassword
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId
#   ORG_GRADLE_PROJECT_signingInMemoryKey
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
