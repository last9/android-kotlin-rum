name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        run: ./gradlew :rum-sdk:test

      - name: Build AAR
        run: ./gradlew :rum-sdk:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: rum-sdk-${{ github.sha }}
          retention-days: 14
          path: rum-sdk/build/outputs/aar/*.aar
